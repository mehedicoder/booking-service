name: Continuous Delivery

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Publish via Dagger
        uses: dagger/dagger-for-github@v6
        with:
          # This executes the identical build layer you just ran locally
          version: "latest" # <-- Automatically pulls the newest release
          verb: call -m github.com/purpleclay/daggerverse/docker build --dir . publish --ref=mehedicoder/booking-service
